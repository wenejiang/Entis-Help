<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=b5c9c0ec" />
  <link rel="icon" sizes="any" type="image/x-icon" href="/favicon.ico?v=b5c9c0ec" />
  <title>帮助文档中心</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0b1020;
      color: #e8ecf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 8%, rgba(92, 129, 255, .28), transparent 32%),
        radial-gradient(circle at 88% 16%, rgba(69, 224, 183, .18), transparent 30%),
        #0b1020;
    }
    main {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 56px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #9fb3ff;
      background: rgba(255,255,255,.04);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #45e0b7;
      box-shadow: 0 0 12px #45e0b7;
    }
    h1 {
      margin: 24px 0 14px;
      font-size: clamp(36px, 6vw, 62px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .lead {
      max-width: 720px;
      margin: 0;
      color: #aeb8d4;
      font-size: 17px;
      line-height: 1.75;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 44px;
    }
    .card {
      position: relative;
      display: grid;
      gap: 12px;
      min-height: 180px;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      color: inherit;
      text-decoration: none;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(122, 155, 255, .55);
      background: linear-gradient(145deg, rgba(92,129,255,.18), rgba(255,255,255,.04));
    }
    .card-product {
      color: #8fa6ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .card-details {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .card-link {
      align-self: end;
      color: #45e0b7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .card-arrow {
      position: absolute;
      top: 26px;
      right: 28px;
      color: #8fa6ff;
      font-size: 22px;
    }
    @media (max-width: 760px) {
      main { width: min(100% - 28px, 1080px); padding-top: 44px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 160px; padding: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Help Center</span>
    <h1>帮助文档中心</h1>
    <p class="lead">选择一个产品与版本，进入对应的帮助文档。</p>
    <section class="grid">
      <a class="card" href="/entismax/v4/">
        <span class="card-product">EntisMax 4</span>
        <span class="card-details">设备安装、系统配置、操作与维护文档。</span>
        <span class="card-link">/entismax/v4/</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="card" href="/entismax/v5/">
        <span class="card-product">EntisMax 5</span>
        <span class="card-details">设备安装、系统配置、操作与维护文档。</span>
        <span class="card-link">/entismax/v5/</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="card" href="/entislng/v4/">
        <span class="card-product">EntisLNG 4</span>
        <span class="card-details">设备安装、系统配置、操作与维护文档。</span>
        <span class="card-link">/entislng/v4/</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="card" href="/entislng/v5/">
        <span class="card-product">EntisLNG 5</span>
        <span class="card-details">设备安装、系统配置、操作与维护文档。</span>
        <span class="card-link">/entislng/v5/</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a></section>
  </main>
</body>
</html>
